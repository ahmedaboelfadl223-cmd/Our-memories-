<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة ختامية ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .letter-box {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 600px;
            text-align: center;
            position: relative;
        }
        .letter-box h1 {
            color: #d81b60;
            margin-bottom: 20px;
            font-size: 2.2em;
        }
        .letter-box p {
            font-size: 1.4em;
            color: #444;
            line-height: 1.8;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .heart {
            font-size: 60px;
            color: #d81b60;
            margin: 20px 0;
            animation: heartbeat 1.2s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #d81b60;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .back-btn:hover {
            background-color: #ad1457;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="letter-box">
        <h1>إلى هجورتي ❤️</h1>
        <p>ربنا يكملك بعقلك يا هجورتي و يارب نفضل مع بعض طول العمر و اتمنى كل ايامنا تبقى خير.</p>
        <p>و قريب متقلقيش هنتخطب و تبدأ صفحه جديدة في حياتنا قدام الناس كلها.</p>
        <p>و لا تقلقي هفضل احمد زي مانا و هفضل احبك طول عمري ياحبيبتي ♥</p>
        
        <div class="heart">❤️</div>
        
        <!-- الزرار ده هيرجعها للصفحة الأولى لو حبت تعيد الذكريات -->
        <a href="welcome.html" class="back-btn">ارجعي شوفي الذكريات تاني</a>
    </div>

</body>
</html>
