<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الأولى - ذكرياتنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #d81b60; margin-bottom: 30px; }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 600px;
            width: 100%;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            border-radius: 10px;
            max-height: 400px;
            object-fit: cover;
        }
        .caption {
            margin-top: 15px;
            font-size: 1.1em;
            text-align: center;
            color: #444;
            font-weight: bold;
        }
        .next-btn {
            margin-top: 40px;
            margin-bottom: 20px;
            padding: 12px 35px;
            background-color: #d81b60;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 4px 15px rgba(216,27,96,0.3);
        }
    </style>
</head>
<body>

    <h2>الصفحة الأولى 📖</h2>

    <div class="gallery">
        <!-- الصورة الأولى -->
        <div class="card">
            <img src="IMG_٢٠٢٦٠٨١١_٠٠٥١٤٨.jpg" alt="صورة 1">
            <div class="caption">كانت اول صورة مع بعض و كنا اول مرة نبقى قريبين من بعض في صورة طول عمرها احساسها مختلف♥</div>
        </div>

        <!-- الصورة التانية -->
        <div class="card">
            <img src="IMG_٢٠٢٦٠٨١١_٠٠٥٠٥٥.jpg" alt="صورة 2">
            <div class="caption">اهي صورة عيد ميلادك ال19 وقتها كنت فقير كنت مدايق اني معييش فلوس اجيبلك هدية و قولت هتفتكريني بخيل🦦😂</div>
        </div>
    </div>

    <!-- زرار الصفحة اللي بعدها -->
    <a href="page2.html" class="next-btn">الصفحة اللي بعدها ➡️</a>

</body>
</html>
