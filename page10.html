<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة العاشرة - ذكرياتنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #fce4ec, #f8bbd0); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #d81b60; margin-bottom: 30px; }
        .gallery { display: flex; flex-direction: column; gap: 30px; max-width: 600px; width: 100%; }
        .card { background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .card img, .card video { width: 100%; border-radius: 10px; max-height: 400px; object-fit: cover; }
        .caption { margin-top: 15px; font-size: 1.1em; text-align: center; color: #444; font-weight: bold; }
        .next-btn { margin-top: 40px; margin-bottom: 20px; padding: 12px 35px; background-color: #d81b60; color: white; text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 1.2em; box-shadow: 0 4px 15px rgba(216,27,96,0.3); }
        .next-btn:hover { background-color: #ad1457; transform: translateY(-3px); }
    </style>
</head>
<body>
    <h2>الصفحة العاشرة 📖</h2>
    <div class="gallery">
        <div class="card">
            <img src="IMG-20260615-WA0102.jpg" alt="صورة 19">
            <div class="caption">و احنا بنفطر يوم في وسط البلد كان يوم رايق و مريم كانت معانا😂😂♥</div>
        </div>
        <div class="card">
            <video controls>
                <source src="VID-20260615-WA0117.mp4" type="video/mp4">
            </video>
            <div class="caption">ان شاء الله المرة الجاية هتبقى في خطوبتنا 🦦😂♥♥</div>
        </div>
    </div>
    <!-- ده الزرار اللي هيوديها لرسالة الختام اللي فيها الوعد بتاعك -->
    <a href="ending.html" class="next-btn">شوفي رسالة الختام ❤️</a>
</body>
</html>
