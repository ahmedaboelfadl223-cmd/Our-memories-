<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكرياتنا الحلوة - أحمد وهاجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .header-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 600px;
            text-align: center;
        }
        .header-card h1 {
            color: #d81b60;
            font-size: 2.8em;
            margin-bottom: 10px;
            margin-top: 0;
        }
        .header-card p {
            font-size: 1.3em;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .start-btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: #d81b60;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.3em;
            box-shadow: 0 4px 15px rgba(216,27,96,0.4);
            transition: transform 0.3s ease, background 0.3s ease;
        }
        .start-btn:hover {
            background-color: #ad1457;
            transform: translateY(-3px);
        }
        .heart-icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="header-card">
        <div class="heart-icon">💌</div>
        <h1>أحلى ذكرياتنا ❤️</h1>
        <p>إلى هجورتي.. جمعتلك هنا حتة من روحنا وأحلى أيام عشناها سوا. كل صفحة فيها جزء من حكايتنا.</p>
        <a href="page1.html" class="start-btn">يلا نبدأ الرحلة ✨</a>
    </div>

</body>
</html>
